<script>
  const rows = JSON.parse(document.getElementById('skill-data').textContent);
  const query = document.getElementById('query');
  const kind = document.getElementById('class');
  const mode = document.getElementById('mode');
  const list = document.getElementById('list');
  const total = document.getElementById('total');
  const captured = rows.filter(row => row.ready).length;
  const planned = rows.filter(row => row.canCapture).length;
  document.getElementById('coverage').textContent = captured === 0
    ? `Nenhum GIF de captura real disponível. ${planned} comparações previstas.`
    : `${captured} de ${planned} comparações previstas com GIFs.`;
  const classes = ['DW', 'DK', 'ELF', 'MG', 'DL', 'SUM', 'RF'];
  for (const cls of classes) kind.add(new Option(cls, cls));

  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function normalize(text) {
    return text.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
  }

  function render() {
    const term = normalize(query.value.trim());
    const selected = rows.filter(row =>
      (!kind.value || row.cls === kind.value) &&
      (!mode.value || (mode.value === 'ready' ? row.ready : row.mode === mode.value)) &&
      normalize(row.name + ' ' + row.id).includes(term));
    total.textContent = selected.length + ' combinações · ' + selected.filter(row => row.ready).length + ' com GIFs';
    const fragment = document.createDocumentFragment();
    for (const row of selected) {
      const card = element('article', '', 'row');
      const title = element('h2', row.name + ' ');
      title.append(element('span', row.cls + ' · #' + row.id, 'id'));
      card.append(title);
      if (row.mode === 'pending' || !row.canCapture) card.append(element('p', row.issue, 'muted'));
      const pairs = element('div', '', 'pairs');
      for (const [slug, label] of [['antigo', 'Antigo'], ['novo', 'Candidato Mega']]) {
        const figure = element('figure');
        figure.append(element('figcaption', label));
        if (row.ready) {
          const image = element('img');
          image.alt = row.name + ' · ' + label;
          image.loading = 'lazy';
          image.src = 'gif/' + row.stem + '-' + slug + '.gif';
          figure.append(image);
        } else {
          figure.append(element('div', row.canCapture ? 'Aguardando captura' : 'Cast indisponível no caso de captura', 'empty'));
        }
        pairs.append(figure);
      }
      if (row.mode !== 'candidate' && row.canCapture) {
        card.append(element('p', 'Sem variante R2219 para este ID.', 'muted'));
      }
      card.append(pairs);
      fragment.append(card);
    }
    list.replaceChildren(fragment);
  }

  query.addEventListener('input', render);
  kind.addEventListener('change', render);
  mode.addEventListener('change', render);
  render();
</script>
