<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UltimateMU</title>
<style>
html,body{margin:0;height:100%;background:#15181c;color:#e6eaee;font:16px/1.4 system-ui,sans-serif}
body{display:flex;flex-direction:column}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#1d2127;border-bottom:1px solid #2c323a;flex:none;-webkit-overflow-scrolling:touch}
nav button{flex:none;background:#262b33;color:#cfd6de;border:1px solid #2c323a;border-radius:18px;padding:8px 14px;font:inherit;white-space:nowrap}
nav button.on{background:#3a6fd8;color:#fff;border-color:#3a6fd8}
#f{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#15181c;display:none}
iframe.on{display:block}
</style></head><body>
<nav id="n"></nav><div id="f"></div>
<script>
const abas=[["Terminal","terminal.html"],["Painel","manha.html"],["Fenrir","fenrir-aprovacao.html"],["Itens extras","extras-mega.html"],["Itens exclusivos","itens-exclusivos.html"],["Skills de área","skills-mega.html"],["Janelas","janelas-aprovacao.html"],["Montarias","montarias.html"],["FPS A/B","fps-ab.html"],["Emendas","emendas.html"],["Antigos x Mega","antigos-x-mega.html"],["Verificação","verificacao-final.html"],["Atmosfera x Mega","atmosfera-mega.html"],["Skills","skills-comparar.html"],["Skills novas do Mega","skills-novas/index.html"],["Monstros","monstros/index.html"],["Aida","aida.html"],["Cursores","cursores.html"],["Pintura do mundo","editor-pintura.html"]];
const n=document.getElementById('n'),f=document.getElementById('f'),fr={};
function abrir(i){abas.forEach((a,j)=>{n.children[j].classList.toggle('on',i===j);if(fr[j])fr[j].classList.toggle('on',i===j);});
 if(!fr[i]){const e=document.createElement('iframe');e.src=abas[i][1];e.className='on';f.appendChild(e);fr[i]=e;}
 else if(i===0){fr[i].contentWindow.location.reload();}
 try{localStorage.setItem('aba',i)}catch(e){}}
abas.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a[0];b.onclick=()=>abrir(i);n.appendChild(b);});
let ini=0;try{ini=+localStorage.getItem('aba')||0}catch(e){}abrir(ini<abas.length?ini:0);
</script></body></html>
